<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fallenwork | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Liquid Glass Custom Styles */
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(10, 20, 40, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 10, 30, 0.37);
        }

        .glass-card {
            background: rgba(13, 27, 54, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: rgba(17, 34, 68, 0.5);
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: 0 16px 40px -10px rgba(29, 78, 216, 0.25),
                        0 0 20px 0 rgba(59, 130, 246, 0.15);
        }

        .glass-input {
            background: rgba(8, 15, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #f8fafc;
        }

        .glass-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            outline: none;
        }

        /* Ambient Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            animation: float 18s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* Card Entrance Animation */
        .card-anim {
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen relative font-sans overflow-x-hidden">

    <!-- Ambient Liquid Glass Background Orbs -->
    <div class="orb w-96 h-96 bg-blue-600/20 top-[-5%] left-[-5%]"></div>
    <div class="orb w-80 h-80 bg-indigo-600/15 bottom-[10%] right-[-5%]" style="animation-delay: -5s;"></div>
    <div class="orb w-72 h-72 bg-sky-500/10 top-[40%] left-[30%]" style="animation-delay: -10s;"></div>

    <!-- Admin Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 glass-panel px-5 py-3 rounded-xl border border-blue-400/40 text-sm font-medium flex items-center gap-3 text-sky-200">
        <i id="toastIcon" class="fas fa-lock"></i>
        <span id="toastMsg">Сообщение</span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-blue-500/15">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center relative">
            
            <!-- Logo / Secret Click Target -->
            <div onclick="handleSecretClick()" class="cursor-pointer select-none group flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">
                    <i class="fas fa-code text-white text-sm"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-wide bg-gradient-to-r from-white via-sky-100 to-blue-300 bg-clip-text text-transparent">
                        fallenwork
                    </span>
                    <span class="text-sky-400 font-semibold text-lg">.dev</span>
                </div>
            </div>

            <!-- Right Contacts & Admin Actions -->
            <div class="flex items-center gap-4">
                <a href="https://t.me/caxaold" target="_blank" class="glass-panel px-4 py-2 rounded-xl text-xs font-medium text-sky-200 hover:text-white hover:border-sky-400/40 transition flex items-center gap-2">
                    <i class="fab fa-telegram text-sky-400 text-sm"></i>
                    <span>@caxaold</span>
                </a>

                <!-- Add Button (Hidden until 3 clicks) -->
                <button id="addBtn" onclick="openModal()" class="hidden bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-blue-500/25 transition transform active:scale-95 flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span>Добавить кейс</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10 relative z-10">
        
        <!-- Hero Title -->
        <div class="mb-10 text-center md:text-left">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-3">
                Портфолио проектов
            </h2>
            <p class="text-slate-400 text-sm max-w-xl leading-relaxed">
                Разработка высокопроизводительных парсеров, автоматизация сбора данных, Telegram-боты с интеграцией ИИ и крипто-аналитика.
            </p>
        </div>

        <!-- Dynamic Category Filter -->
        <div class="flex gap-2.5 overflow-x-auto pb-4 mb-8 scrollbar-none" id="categoryFilters">
            <!-- JS dynamic tabs -->
        </div>

        <!-- Projects Grid -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="projectsGrid">
            <!-- JS dynamic cards -->
        </div>
    </main>

    <!-- Modal Form (Glassmorphism Modal) -->
    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="glass-panel rounded-2xl max-w-lg w-full p-6 relative border border-blue-400/30 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center hover:bg-white/5 transition">
                <i class="fas fa-times text-base"></i>
            </button>

            <h3 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <i class="fas fa-folder-plus text-sky-400"></i>
                <span id="modalTitle">Добавить проект</span>
            </h3>
            
            <form id="projectForm" onsubmit="saveProject(event)" class="space-y-4">
                <input type="hidden" id="projectId">
                
                <div>
                    <label class="block text-xs font-medium text-sky-200/80 mb-1">Название проекта</label>
                    <input type="text" id="title" placeholder="например: Auto Classifieds Scraper" required class="w-full glass-input rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-sky-200/80 mb-1">Категория (любая)</label>
                    <input type="text" id="category" placeholder="Парсеры, Telegram-боты, Web..." required class="w-full glass-input rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-sky-200/80 mb-1">Ссылка на обложку (Image URL)</label>
                    <input type="text" id="imageUrl" placeholder="https://images.unsplash.com/..." class="w-full glass-input rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-sky-200/80 mb-1">Ссылка на GitHub репозиторий</label>
                    <input type="text" id="githubUrl" placeholder="https://github.com/fallenworked/..." required class="w-full glass-input rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-sky-200/80 mb-1">Описание проекта</label>
                    <textarea id="description" rows="3" placeholder="Краткое описание функционала и стека..." required class="w-full glass-input rounded-xl p-3 text-sm resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-blue-500/10">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
                        Отмена
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white shadow-lg shadow-blue-500/20 transition">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Area -->
    <script>
        let projects = [
            {
                id: 1,
                title: "Multi-Threaded Auto Classifieds Scraper",
                category: "Парсеры",
                imageUrl: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80",
                githubUrl: "https://github.com/fallenworked/auto-parser",
                description: "Высокопроизводительный парсер автомобильных объявлений (av.by / Drom) с эмуляцией TLS-отпечатков Chrome 120 (curl_cffi) для обхода Cloudflare и экспортом в XLSX / JSON."
            },
            {
                id: 2,
                title: "Wildberries Price Tracker Bot",
                category: "Telegram-боты",
                imageUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
                githubUrl: "https://github.com/fallenworked/wb-price-tracker-bot",
                description: "Асинхронный Telegram-бот на aiogram 3 для мониторинга цен на Wildberries. Поддерживает фоновую проверку (APScheduler), графики динамики цен (Matplotlib) и асинхронную БД SQLite."
            },
            {
                id: 3,
                title: "Crypto P2P Arbitrage & Spread Scanner",
                category: "Крипто / FinTech",
                imageUrl: "https://images.unsplash.com/photo-1642543492481-44e81e3914a7?auto=format&fit=crop&w=800&q=80",
                githubUrl: "https://github.com/fallenworked/crypto-p2p-arbitrage-scanner",
                description: "Высокоскоростной асинхронный сканер арбитражных связок P2P-рынка (Bybit) на aiogram 3 и aiohttp. Оснащен фильтрацией неблагонадежных мерчантов, дедупликацией сигналов через Redis и мгновенным расчетом чистого профита в Telegram."
            },
            {
                id: 4,
                title: "AI Freelance Lead Generator & Cover Letter Bot",
                category: "ИИ & Автоматизация",
                imageUrl: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=800&q=80",
                githubUrl: "https://github.com/fallenworked/ai-freelance-leadgen",
                description: "Асинхронный парсер заказов с бирж (Habr Freelance) с нейросетевым анализом ТЗ через OpenAI API (GPT-4o). Оценивает адекватность задач, генерирует готовые продающие отклики и присылает лиды в Telegram."
            }
        ];

        let currentFilter = 'all';
        let isAdmin = false;
        let clickCount = 0;
        let clickTimer = null;

        function fixUrl(url) {
            if (!url) return '';
            url = url.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        function handleSecretClick() {
            clickCount++;
            clearTimeout(clickTimer);

            if (clickCount === 3) {
                isAdmin = !isAdmin;
                clickCount = 0;
                
                showToast(
                    isAdmin ? "Режим администратора активирован!" : "Режим администратора отключен",
                    isAdmin ? "fa-unlock text-emerald-400" : "fa-lock text-slate-400"
                );

                document.getElementById('addBtn').classList.toggle('hidden', !isAdmin);
                renderProjects();
            } else {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 800);
            }
        }

        function showToast(msg, iconClass) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = `fas ${iconClass}`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-0');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? projects 
                : projects.filter(p => p.category.toLowerCase() === currentFilter.toLowerCase());

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500 glass-panel rounded-2xl">
                        <i class="fas fa-inbox text-3xl mb-3 text-slate-600 block"></i>
                        В этой категории пока нет проектов.
                    </div>
                `;
                return;
            }

            filtered.forEach((p, index) => {
                const imageBlock = p.imageUrl 
                    ? `<div class="h-44 w-full overflow-hidden relative">
                        <img src="${p.imageUrl}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#080f1e] via-transparent to-transparent"></div>
                       </div>`
                    : `<div class="h-20 w-full bg-gradient-to-r from-blue-900/30 to-slate-900/40 border-b border-blue-500/10"></div>`;

                const deleteBtn = isAdmin 
                    ? `<button onclick="deleteProject(${p.id})" class="text-slate-500 hover:text-rose-400 text-xs transition p-1" title="Удалить">
                        <i class="fas fa-trash-alt"></i>
                       </button>` 
                    : '';

                grid.innerHTML += `
                    <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between group card-anim" style="animation-delay: ${index * 0.1}s">
                        <div>
                            ${imageBlock}
                            <div class="p-5">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-[11px] font-semibold bg-blue-500/10 text-sky-300 px-3 py-1 rounded-full border border-blue-400/20">
                                        ${p.category}
                                    </span>
                                    ${deleteBtn}
                                </div>
                                <h3 class="text-base font-bold text-white mb-2 group-hover:text-sky-200 transition">
                                    ${p.title}
                                </h3>
                                <p class="text-slate-400 text-xs leading-relaxed mb-4">
                                    ${p.description}
                                </p>
                            </div>
                        </div>

                        <div class="px-5 pb-5 pt-2 border-t border-blue-500/10 flex items-center justify-between">
                            <a href="${p.githubUrl}" target="_blank" class="text-xs font-semibold text-sky-400 hover:text-sky-300 flex items-center gap-2 transition">
                                <i class="fab fa-github text-sm"></i>
                                <span>GitHub / Код</span>
                            </a>
                            <i class="fas fa-arrow-up-right-from-square text-[10px] text-slate-500 group-hover:text-sky-400 transition"></i>
                        </div>
                    </div>
                `;
            });

            renderFilters();
        }

        function renderFilters() {
            const container = document.getElementById('categoryFilters');
            const categories = ['all', ...new Set(projects.map(p => p.category))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" 
                        class="px-4 py-2 rounded-xl text-xs font-medium transition whitespace-nowrap border ${
                            currentFilter === cat 
                            ? 'bg-blue-600/30 text-sky-200 border-blue-400/40 shadow-lg shadow-blue-500/10' 
                            : 'glass-panel text-slate-400 border-blue-500/10 hover:text-slate-200 hover:border-blue-500/20'
                        }">
                    ${cat === 'all' ? 'Все проекты' : cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            renderProjects();
        }

        function openModal() {
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            document.getElementById('modalTitle').innerText = 'Добавить новый проект';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value.trim();
            const imageUrl = fixUrl(document.getElementById('imageUrl').value);
            const githubUrl = fixUrl(document.getElementById('githubUrl').value);
            const description = document.getElementById('description').value;

            if (id) {
                const index = projects.findIndex(p => p.id == id);
                projects[index] = { id: Number(id), title, category, imageUrl, githubUrl, description };
            } else {
                projects.push({
                    id: Date.now(),
                    title,
                    category,
                    imageUrl,
                    githubUrl,
                    description
                });
            }

            closeModal();
            renderProjects();
            showToast("Проект сохранен!", "fa-check text-emerald-400");
        }

        function deleteProject(id) {
            if (confirm('Удалить проект из списка?')) {
                projects = projects.filter(p => p.id !== id);
                renderProjects();
                showToast("Проект удален", "fa-trash text-rose-400");
            }
        }

        // Init
        renderProjects();
    </script>
</body>
</html>
